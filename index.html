if(x.history&&typeof x.history==='object'&&!Array.isArray(x.history)){for(const w of WORDS){const h=x.history[w.id];if(h&&Number.isInteger(h.seen)&&h.seen>=0&&h.seen<=100000&&Number.isInteger(h.missed)&&h.missed>=0&&h.missed<=h.seen)out.history[w.id]={seen:h.seen,missed:h.missed}}}
if(Array.isArray(x.help))out.help=[...new Set(x.help.filter(t=>['picture','meaning','blank','spell'].includes(t)))];return out}
function loadProgress(storageGetter){try{const raw=storageGetter().getItem(STORAGE_KEY);return raw?validateSave(JSON.parse(raw))||freshSave():freshSave()}catch{return freshSave()}}
function writeProgress(storageGetter,save){try{storageGetter().setItem(STORAGE_KEY,JSON.stringify(save));return true}catch{return false}}
function removeProgress(storageGetter){try{storageGetter().removeItem(STORAGE_KEY);return true}catch{return false}}
function earnedBadges(stars,maxStreak){const ids=[];if(stars.some(v=>v>0))ids.push('first');if(maxStreak>=5)ids.push('streak');if(stars.some(v=>v===3))ids.push('perfect');if(stars[4]>0)ids.push('halfway');if(stars.reduce((a,b)=>a+b,0)>=20)ids.push('collector');if(stars[9]>0)ids.push('wizard');return ids}
function commitResult(save,session){if(session.committed)return save;session.committed=true;const out=validateSave(save)||freshSave();out.stars[session.level-1]=Math.max(out.stars[session.level-1],starsFor(session.correct));out.points=Math.min(Number.MAX_SAFE_INTEGER,out.points+session.points);out.badges=[...new Set([...out.badges,...earnedBadges(out.stars,session.maxStreak)])];for(const record of session.records){const old=out.history[record.id]||{seen:0,missed:0};out.history[record.id]={seen:Math.min(100000,old.seen+1),missed:Math.min(100000,old.missed+(record.correct?0:1))}}return out}
function validateWords(){const errors=[];if(WORDS.length!==120)errors.push('Expected 120 words');const seen=new Set();const ids=new Set();for(const w of WORDS){if(seen.has(w.word)||ids.has(w.id))errors.push('Duplicate word or ID');seen.add(w.word);ids.add(w.id);if(w.definition.trim().split(/\s+/).length>=12)errors.push('Definition too long: '+w.word);if((w.template.match(/\{word\}/g)||[]).length!==1)errors.push('Invalid blank: '+w.word);if(w.allowed.includes('spell')&&!/^[a-z]{3,7}$/.test(w.word))errors.push('Invalid spelling: '+w.word);if(w.allowed.includes('picture')&&!w.picture)errors.push('Missing picture: '+w.word);if(w.level===8){const opposite=WORDS.find(v=>v.id===w.opposite);if(!opposite||opposite.opposite!==w.id)errors.push('Invalid opposite: '+w.word)}}for(let n=1;n<=9;n++){const bank=WORDS.filter(w=>w.level===n);if(bank.length!==(n<=6?12:16))errors.push('Wrong allocation '+n);for(const [type,count]of Object.entries(LEVELS[n-1].mix))if(bank.filter(w=>w.allowed.includes(type)).length<count)errors.push('Insufficient '+type+' '+n)}return errors}
function makeQuestions(level,history={},rng=Math.random){const bank=WORDS.filter(w=>level===10||w.level===level);const types=Object.entries(LEVELS[level-1].mix).flatMap(([type,count])=>Array(count).fill(type));types.sort((a,b)=>bank.filter(w=>w.allowed.includes(a)).length-bank.filter(w=>w.allowed.includes(b)).length);const ordered=shuffle(bank,rng).sort((a,b)=>{const ha=history[a.id]||{seen:0,missed:0};const hb=history[b.id]||{seen:0,missed:0};return Number(ha.seen>0)-Number(hb.seen>0)||Number(hb.missed>0)-Number(ha.missed>0)||ha.seen-hb.seen});let selected=[];
function pick(i,used){if(i===types.length){if(level===10&&(new Set(selected.map(q=>q.word.level)).size<4||!selected.some(q=>q.word.level>=7)))return false;return true}for(const w of ordered){if(used.has(w.id)||!w.allowed.includes(types[i]))continue;selected.push({word:w,type:types[i]});used.add(w.id);if(pick(i+1,used))return true;used.delete(w.id);selected.pop()}return false}
if(!pick(0,new Set()))throw new Error('Question bank cannot satisfy level '+level);
return shuffle(selected,rng).map(({word,type})=>{const count=level<=4?3:4;const distractors=shuffle(WORDS.filter(w=>w.level===word.level&&w.id!==word.id),rng).slice(0,count-1);return {word,type,options:shuffle([word,...distractors],rng).map(w=>w.id),tiles:type==='spell'?shuffle([...word.word].map((letter,index)=>({letter,id:index})),rng):[]}})}
function selectedSpelling(question,selection){return selection.map(id=>question.tiles.find(t=>t.id===id).letter).join('')}

class AudioManager{
constructor(){this.ctx=null;this.master=null;this.musicGain=null;this.fxGain=null;this.timer=null;this.voices=new Set();this.mode='menu';this.beat=0;this.next=0;this.settings={music:true,effects:true}}
async unlock(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.18;this.master.connect(this.ctx.destination);this.musicGain=this.ctx.createGain();this.musicGain.gain.value=.24;this.musicGain.connect(this.master);this.fxGain=this.ctx.createGain();this.fxGain.gain.value=.55;this.fxGain.connect(this.master)}if(this.ctx.state==='suspended')await this.ctx.resume();this.sync()}catch{}}
tone(freq,start,duration,gain,category='music'){if(!this.ctx||this.ctx.state!=='running')return;try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.025);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g);g.connect(category==='music'?this.musicGain:this.fxGain);const voice={o,g,category};this.voices.add(voice);o.onended=()=>{this.voices.delete(voice);o.disconnect();g.disconnect()};o.start(start);o.stop(start+duration+.03)}catch{}}
stop(category){for(const v of [...this.voices])if(!category||v.category===category){try{v.o.stop()}catch{}this.voices.delete(v)}}
sync(){clearInterval(this.timer);this.timer=null;this.stop('music');if(this.ctx&&this.ctx.state==='running'&&!document.hidden&&this.settings.music){this.beat=0;this.next=this.ctx.currentTime+.05;this.timer=setInterval(()=>this.schedule(),100);this.schedule()}}
schedule(){if(!this.ctx||document.hidden)return;const tune=this.mode==='play'?[0,2,4,7,9,7,4,2]:[0,4,7,4,2,9,7,4];const step=this.mode==='play'?.38:.62;while(this.next<this.ctx.currentTime+.3){const semitone=tune[this.beat%tune.length];this.tone(261.63*Math.pow(2,semitone/12),this.next,.48,.3);this.beat++;this.next+=step}}
setMode(mode){if(this.mode!==mode){this.mode=mode;this.sync()}}
setSettings(settings){this.settings={...settings};if(!settings.effects)this.stop('fx');this.sync()}
fx(type){if(!this.ctx||!this.settings.effects||document.hidden)return;const sequence=type==='wrong'?[220]:type==='complete'?[523,659,784,1047]:type==='star'?[659,880,1047]:[523,659];sequence.forEach((f,i)=>this.tone(f,this.ctx.currentTime+i*.1,.22,.5,'fx'))}
pause(){clearInterval(this.timer);this.timer=null;this.stop();if(this.ctx)this.ctx.suspend().catch(()=>{})}
}

function finishDialog(id){const cb=dialogCallback;dialogCallback=null;dialog.close();if(restoreTarget&&restoreTarget.isConnected)restoreTarget.focus();if(cb)cb(id)}
dialog.addEventListener('click',e=>{const b=e.target.closest('[data-dialog]');if(b)finishDialog(b.dataset.dialog)});dialog.addEventListener('cancel',e=>{e.preventDefault();finishDialog('cancel')});
function navigate(name){if((screen==='question'||screen==='intro'||(screen==='settings'&&['question','intro'].includes(settingsBack)))&&session&&!session.committed){openDialog('Leave this island?','<p>This try will not be saved. Your earlier stars are safe.</p>',[{id:'stay',label:'Keep playing',safe:true},{id:'leave',label:'Leave island',secondary:true}],id=>{if(id==='leave'){session=null;show(name)}})}else show(name)}
function help(type,automatic=false){const texts={picture:'Look closely at the picture. Tap the word that names it.',meaning:'Read the clue. Tap the word that matches its meaning.',blank:'Read the sentence and clue. Choose the word for the gap.',spell:'Tap letter tiles to build the word. Use Undo to take one back. When every space is filled, tap Check.'};openDialog('Let’s try it together',`<p>${texts[type]}</p><div class="help-step">${type==='spell'?'Example: c + u + p → cup':'Example: 📖 → book'}</div><p>You have two tries. Then we learn the word together.</p>`,[{id:'ok',label:'Got it!',safe:true}],()=>{if(automatic&&!saved.help.includes(type)){saved.help.push(type);persist()}})}
function startQuestions(){show('question');const type=getQ().type;if(!saved.help.includes(type))help(type,true)}
function sparkle(big=false){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const host=document.getElementById('sparkles');host.replaceChildren();for(let i=0;i<(big?20:8);i++){const s=document.createElement('span');s.className='spark';s.textContent=['✦','★','•'][i%3];s.style.cssText=`--x:${(Math.random()-.5)*650}px;--y:${(Math.random()-.5)*550}px;--delay:${Math.random()*.15}s;color:${['#226347','#996e19','#746187'][i%3]}`;host.appendChild(s)}setTimeout(()=>host.replaceChildren(),1200)}
function answer(correct,id=null){if(!session||session.resolved||screen!=='question')return;if(id&&session.wrong.includes(id))return;const q=getQ();const earned=scoreAnswer(session.streak,session.attempt,correct);session.streak=earned.streak;session.points+=earned.points;session.maxStreak=Math.max(session.maxStreak,session.streak);if(!correct&&id)session.wrong.push(id);if(correct||session.attempt===2){session.resolved=true;session.lastCorrect=correct;session.lastPoints=earned.points;if(correct)session.correct++;session.records.push({id:q.word.id,correct});render();announce(correct?'Correct. '+q.word.word+'. '+earned.points+' points. '+q.word.definition:'The word is '+q.word.word+'. '+q.word.definition);const next=app.querySelector('[data-action="next"]');if(next)next.focus({preventScroll:true});audio.fx(correct?'correct':'wrong');if(correct)sparkle()}else{session.attempt=2;render();announce(q.type==='spell'?'Try again. The first letter is '+q.word.word[0]:'Try another word.');audio.fx('wrong');const target=app.querySelector(q.type==='spell'?'[data-action="undo"]':'.choice:not(:disabled)');if(target)target.focus({preventScroll:true});if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)app.querySelector('.feedback').classList.add('shake')}}
function next(){if(!session||!session.resolved)return;if(session.index===7){const before=[...saved.badges];saved=commitResult(saved,session);persist();result={level:session.level,stars:starsFor(session.correct),points:session.points,correct:session.correct,newBadges:saved.badges.filter(id=>!before.includes(id))};audio.fx('complete');show(session.level===10&&result.stars?'celebration':'result');sparkle(true);return}session.index++;session.attempt=1;session.wrong=[];session.resolved=false;session.selection=[];show('question');if(!saved.help.includes(getQ().type))help(getQ().type,true)}
function renderTileEdit(action,id){if(!session||session.resolved||screen!=='question'||getQ().type!=='spell')return;const q=getQ();if(action==='tile'){if(session.selection.includes(id)||!q.tiles.some(t=>t.id===id)||session.selection.length>=q.word.word.length)return;session.selection.push(id)}if(action==='undo')session.selection.pop();if(action==='clear')session.selection=[];render();announce('Your spelling: '+(selectedSpelling(q,session.selection).split('').join(' ')||'empty'));const preferred=action==='tile'?app.querySelector(`.tile[data-id="${id}"]`):app.querySelector(`[data-action="${action}"]`);const fallback=session.selection.length===q.word.word.length?app.querySelector('[data-action="check"]'):app.querySelector('.tile:not(:disabled)');if(preferred&&!preferred.disabled)preferred.focus({preventScroll:true});else if(fallback)fallback.focus({preventScroll:true})}
function resetFlow(){openDialog('Start over?','<p>All of your stars, points, and badges will be erased.</p>',[{id:'cancel',label:'Keep progress',safe:true},{id:'continue',label:'Continue',secondary:true}],id=>{if(id==='continue')openDialog('Erase your adventure?','<p>This cannot be undone. You will return to Island 1.</p>',[{id:'cancel',label:'Keep progress',safe:true},{id:'erase',label:'Erase progress',danger:true}],answer=>{if(answer==='erase'){removeProgress(()=>window.localStorage);saved=freshSave();session=null;result=null;audio.pause();audio.settings={...saved.settings};show('home');announce('Progress erased. A fresh adventure is ready.')}})})}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled||dialog.open)return;const action=button.dataset.action;audio.unlock();switch(action){case 'home':navigate('home');break;case 'play':show('map');break;case 'map':navigate('map');break;case 'badges':navigate('badges');break;case 'level':newSession(Number(button.dataset.level));break;case 'start':startQuestions();break;case 'answer':answer(button.dataset.id===getQ().word.id,button.dataset.id);break;case 'next':next();break;case 'tile':case 'undo':case 'clear':renderTileEdit(action,Number(button.dataset.id));break;case 'check':if(session&&getQ().type==='spell'&&session.selection.length===getQ().word.word.length)answer(selectedSpelling(getQ(),session.selection)===getQ().word.word);break;case 'help':help(getQ().type);break;case 'how':openDialog('A little adventure in words','<p>Choose an island. Read a clue or look at a picture. Tap an answer, or build a word with letter tiles.</p><p>Each island has 8 questions. Find 4 words to earn a star and open the next island. You can always try again.</p>',[{id:'ok',label:'Let’s go!',safe:true}],()=>{});break;case 'settings':settingsBack=screen;show('settings');break;case 'settings-back':show(settingsBack);break;case 'music':case 'effects':saved.settings[action]=!saved.settings[action];audio.setSettings(saved.settings);persist();render();const toggle=action==='music'&&screen!=='settings'?document.getElementById('music-btn'):app.querySelector(`[data-action="${action}"]`);if(toggle)toggle.focus({preventScroll:true});announce(action+' '+(saved.settings[action]?'on':'off'));break;case 'reset':resetFlow();break;case 'result':show('result');break}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.pause();else if(audio.ctx)audio.unlock()});window.addEventListener('pagehide',()=>audio.pause());show('home',false);
</script></body></html>
